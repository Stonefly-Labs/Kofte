name: Repository or documentation task
description: Improve developer experience without expanding product scope.
title: "chore: "
body:
  - type: textarea
    id: scope
    attributes:
      label: Change and motivation
      description: What should change, and what is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Include repository checks and documentation affected.
    validations:
      required: true
