name: Product checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quality
            arguments: --suite quality
            postgres: false
            browser: false
          - name: unit
            arguments: --suite unit
            postgres: false
            browser: false
          - name: integration-sqlite
            arguments: --suite integration --provider sqlite
            postgres: false
            browser: false
          - name: integration-postgres
            arguments: --suite integration --provider postgres --disposable-postgres
            postgres: true
            browser: false
          - name: recovery
            arguments: --suite recovery --provider both --disposable-postgres
            postgres: true
            browser: true
          - name: contract
            arguments: --suite contract --provider both --disposable-postgres
            postgres: true
            browser: false
          - name: browser
            arguments: --suite browser
            postgres: true
            browser: true
          - name: privacy
            arguments: --suite privacy --provider both --disposable-postgres
            postgres: true
            browser: true
          - name: startup
            arguments: --suite startup --warm-starts 10
            postgres: false
            browser: true
          - name: failure-propagation
            arguments: --suite failure-propagation --disposable-postgres
            postgres: true
            browser: true
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.402
      - name: Set up pinned Node and bundled npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
      - name: Restore locked .NET dependencies
        run: dotnet restore Kofte.slnx --locked-mode
      - name: Restore locked npm dependencies
        run: npm ci
      - name: Prepare pinned PostgreSQL test image
        if: matrix.postgres
        run: |
          docker version
          docker compose version
          docker pull postgres:17@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939
      - name: Prepare pinned Chromium and OS dependencies
        if: matrix.browser
        run: |
          grep -Fq 'http://azure.archive.ubuntu.com/ubuntu' /etc/apt/apt-mirrors.txt
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npm exec --workspace tests/e2e -- playwright install --with-deps chromium
      - name: Run named host, manifest and storage verification
        env:
          VERIFICATION_ARGUMENTS: ${{ matrix.arguments }}
        run: python3 scripts/verify.py $VERIFICATION_ARGUMENTS
      - name: Verify configured HTTPS identity through public browser recipes
        if: matrix.name == 'browser'
        env:
          KOFTE_TEST_POSTGRES_ALLOW_DISPOSABLE: "true"
        run: |
          dotnet tests/contract/Kofte.Identity.Consumer/bin/Release/net10.0/Kofte.Identity.Consumer.dll --scenario oidc-login --provider sqlite
          dotnet tests/contract/Kofte.Identity.Consumer/bin/Release/net10.0/Kofte.Identity.Consumer.dll --scenario trust-refusal --provider sqlite
          dotnet tests/contract/Kofte.Identity.Consumer/bin/Release/net10.0/Kofte.Identity.Consumer.dll --scenario nominated-enrollment --provider sqlite
          dotnet tests/contract/Kofte.Identity.Consumer/bin/Release/net10.0/Kofte.Identity.Consumer.dll --scenario enrollment-race --provider sqlite
          dotnet tests/contract/Kofte.Identity.Consumer/bin/Release/net10.0/Kofte.Identity.Consumer.dll --scenario session-boundary --provider sqlite
          dotnet tests/contract/Kofte.Identity.Consumer/bin/Release/net10.0/Kofte.Identity.Consumer.dll --scenario development-isolation --provider sqlite
          dotnet tests/contract/Kofte.Identity.Consumer/bin/Release/net10.0/Kofte.Identity.Consumer.dll --scenario oidc-login --provider postgres
          dotnet tests/contract/Kofte.Identity.Consumer/bin/Release/net10.0/Kofte.Identity.Consumer.dll --scenario trust-refusal --provider postgres
          dotnet tests/contract/Kofte.Identity.Consumer/bin/Release/net10.0/Kofte.Identity.Consumer.dll --scenario nominated-enrollment --provider postgres
          dotnet tests/contract/Kofte.Identity.Consumer/bin/Release/net10.0/Kofte.Identity.Consumer.dll --scenario enrollment-race --provider postgres
          dotnet tests/contract/Kofte.Identity.Consumer/bin/Release/net10.0/Kofte.Identity.Consumer.dll --scenario session-boundary --provider postgres
          dotnet tests/contract/Kofte.Identity.Consumer/bin/Release/net10.0/Kofte.Identity.Consumer.dll --scenario development-isolation --provider postgres
      - name: Retain safe verification reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-${{ matrix.name }}
          path: artifacts/verification/*.json
          if-no-files-found: warn
          retention-days: 14
